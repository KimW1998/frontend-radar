name: Frontend Radar check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  stack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run stack check
        run: npm run check
        env:
          FRONTEND_RADAR_FAIL_ON_CRITICAL: 'true'
          FRONTEND_RADAR_FAIL_ON_NODE_EOL: 'true'
